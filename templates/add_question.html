{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card glass-card p-4">
            <h3 class="fw-bold mb-4"><i class="bi bi-plus-circle"></i> Add New Question</h3>
            <form action="{{ url_for('add_question') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Question Text</label>
                    <textarea name="question" class="form-control" rows="3" required></textarea>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Option 1 (Correct Answer)</label>
                        <input type="text" name="option1" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Option 2</label>
                        <input type="text" name="option2" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Option 3</label>
                        <input type="text" name="option3" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Option 4</label>
                        <input type="text" name="option4" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Exact Correct Answer String</label>
                    <input type="text" name="answer" class="form-control" placeholder="Must match Option 1, 2, 3, or 4" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Subject</label>
                        <input type="text" name="subject" class="form-control" placeholder="e.g. Python, SQL, Math" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Category</label>
                        <input type="text" name="category" class="form-control" value="General">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Difficulty</label>
                        <select name="difficulty" class="form-select">
                            <option value="Easy">Easy</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Explanation (Optional)</label>
                    <textarea name="explanation" class="form-control" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Save Question</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
