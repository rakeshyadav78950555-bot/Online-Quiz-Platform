{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold"><i class="bi bi-question-square"></i> Manage Questions</h2>
    <div>
        <a href="{{ url_for('add_question') }}" class="btn btn-success me-2"><i class="bi bi-plus-lg"></i> Add Question</a>
        <a href="{{ url_for('export_questions', format_type='csv') }}" class="btn btn-outline-info me-1"><i class="bi bi-filetype-csv"></i> CSV Export</a>
        <a href="{{ url_for('export_questions', format_type='excel') }}" class="btn btn-outline-success"><i class="bi bi-file-earmark-excel"></i> Excel Export</a>
    </div>
</div>

<!-- Search & Filter Controls -->
<div class="card glass-card p-3 mb-4">
    <form method="GET" action="{{ url_for('questions') }}" class="row g-2">
        <div class="col-md-6">
            <input type="text" name="q" class="form-control" placeholder="Search question text..." value="{{ request.args.get('q', '') }}">
        </div>
        <div class="col-md-4">
            <select name="subject" class="form-select">
                <option value="">All Subjects</option>
                {% for s in subjects %}
                    <option value="{{ s }}" {% if request.args.get('subject') == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Filter</button>
        </div>
    </form>
</div>

<!-- Question List Table -->
<div class="card glass-card p-4">
    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Question</th>
                    <th>Subject</th>
                    <th>Category</th>
                    <th>Difficulty</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for q in questions %}
                <tr>
                    <td>{{ q.id }}</td>
                    <td style="max-width: 300px;" class="text-truncate">{{ q.question }}</td>
                    <td><span class="badge bg-primary">{{ q.subject }}</span></td>
                    <td>{{ q.category }}</td>
                    <td>
                        <span class="badge {% if q.difficulty == 'Easy' %}bg-success{% elif q.difficulty == 'Medium' %}bg-warning{% else %}bg-danger{% endif %}">
                            {{ q.difficulty }}
                        </span>
                    </td>
                    <td>
                        <a href="{{ url_for('edit_question', id=q.id) }}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                        <a href="{{ url_for('delete_question', id=q.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this question?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
