{% extends "base.html" %}


{% block content %}


<div class="card p-4 mx-auto"
style="max-width:450px">


<h2 class="text-center">
Create Account
</h2>



<form method="POST">


<input class="form-control mt-3"
name="username"
placeholder="Username"
required>


<input class="form-control mt-3"
name="email"
placeholder="Email"
required>


<input class="form-control mt-3"
name="password"
type="password"
placeholder="Password"
required>


<button class="btn btn-success w-100 mt-4">

Register

</button>


</form>


</div>


{% endblock %}
